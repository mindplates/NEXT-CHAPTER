plugins {
    id 'org.springframework.boot' version '4.0.6' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'com.diffplug.spotless' version '7.0.2' apply false
}

allprojects {
    group = 'com.mindplates'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
        maven { url 'https://repo.spring.io/milestone' }
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'jacoco'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'com.diffplug.spotless'

    // 포매팅은 편집 훅이 아니라 빌드에서 강제한다. 편집마다 Gradle 을 부르면 매 편집에
    // 수 초가 붙어 실용성이 없고, 포맷이 어긋난 채로 커밋되는 것은 빌드가 잡으면 충분하다.
    //
    // palantirJavaFormat 을 쓰는 이유는 4-space 라 WORKS 관례와 어긋나지 않기 때문이다.
    // google-java-format 은 2-space 로 강제해 기존 코드와 전부 충돌한다.
    spotless {
        java {
            target 'src/**/*.java'
            palantirJavaFormat()
            removeUnusedImports()
            trimTrailingWhitespace()
            endWithNewline()
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    dependencyManagement {
        imports {
            mavenBom 'org.springframework.boot:spring-boot-dependencies:4.0.6'
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testImplementation 'org.assertj:assertj-core'
        testImplementation 'org.mockito:mockito-core'
        testImplementation 'org.mockito:mockito-junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs.add('-parameters')
        options.encoding = 'UTF-8'
    }

    tasks.named('test') {
        useJUnitPlatform()
        finalizedBy jacocoTestReport
    }

    jacocoTestReport {
        dependsOn test
        reports {
            csv.required = true
            html.required = true
            xml.required = true
        }
    }

    // 커버리지 80% 게이트 — 프로젝트 테스트 규칙의 최소치.
    //
    // M0 에서는 걸지 않았다. 기능이 없는 단계에 게이트를 걸면 첫날부터 빨간불이 된다.
    // 첫 도메인 로직이 들어온 M1 이 끝나는 지점이 걸 수 있는 가장 이른 시점이고, 지금 걸지 않으면
    // 커버리지가 낮은 상태가 기본값이 되어 되돌리는 비용이 계속 커진다.
    //
    // 어댑터도 예외를 두지 않는다. 이 제품의 위험이 저장소 경계에 몰려 있어서 어댑터를 면제하면
    // 정작 깨질 곳이 게이트 밖에 남는다.
    //
    // 기준을 INSTRUCTION 으로 잡은 이유는 분기 커버리지가 record 의 생성 검증처럼 분기가 많고
    // 값이 낮은 코드에 과도하게 민감하기 때문이다.
    jacocoTestCoverageVerification {
        dependsOn test
        violationRules {
            rule {
                limit {
                    counter = 'INSTRUCTION'
                    value = 'COVEREDRATIO'
                    minimum = 0.80
                }
            }
        }
        // 테스트 소스가 없는 모듈(조립만 하는 bootstrap, 소스 없는 adapter 부모)은 검증 대상이 아니다.
        onlyIf { file("${projectDir}/src/test/java").exists() }
    }

    tasks.named('check') {
        dependsOn tasks.named('jacocoTestCoverageVerification')
    }
}

// ---------------------------------------------------------------------------
// 헥사고날 의존 방향 검증
//
// 골격을 세우는 지금이 이 규칙을 강제할 수 있는 유일하게 싼 타이밍이다. 나중에
// 넣으면 그때는 이미 깨져 있고, 되돌리는 비용이 붙는다.
//
//   common      →  (없음)
//   domain      →  common
//   application →  common, domain
//   adapter/*   →  common, domain, application          ← 어댑터끼리 의존 금지
//   bootstrap   →  전부                                  ← 조립만 하는 모듈
// ---------------------------------------------------------------------------

def COMMON = ':nextchapter-common'
def DOMAIN = ':nextchapter-domain'
def APPLICATION = ':nextchapter-application'

def adapterAllowed = [COMMON, DOMAIN, APPLICATION].toSet()
def moduleAllowed = [
        (COMMON)                 : [].toSet(),
        (DOMAIN)                 : [COMMON].toSet(),
        (APPLICATION)            : [COMMON, DOMAIN].toSet(),
        ':nextchapter-adapter'   : [].toSet(),
]

subprojects { sp ->
    sp.tasks.register('checkModuleDependencies') {
        group = 'verification'
        description = '헥사고날 의존 방향을 검증한다. 허용되지 않은 모듈 간 의존은 빌드 실패다.'
    }

    sp.afterEvaluate {
        def path = sp.path
        def allowed
        if (path == ':nextchapter-bootstrap') {
            allowed = sp.rootProject.subprojects.collect { it.path }.toSet()
        } else if (path.startsWith(':nextchapter-adapter:')) {
            allowed = adapterAllowed
        } else {
            allowed = moduleAllowed.getOrDefault(path, [].toSet())
        }

        def declared = sp.configurations
                .collectMany { c -> c.dependencies.withType(ProjectDependency).collect { d -> d.path } }
                .toSet()
        def violations = (declared - allowed).toSorted()

        sp.tasks.named('checkModuleDependencies').configure {
            doLast {
                if (!violations.isEmpty()) {
                    throw new GradleException(
                            "의존 방향 위반 — ${path} 이(가) ${violations.join(', ')} 에 의존한다.\n" +
                            "허용: ${allowed.isEmpty() ? '(없음)' : allowed.toSorted().join(', ')}")
                }
            }
        }

        sp.tasks.named('check').configure {
            dependsOn sp.tasks.named('checkModuleDependencies')
        }
    }
}
