spring.application.name=nextchapter
server.port=34000

# --- PostgreSQL (pgvector) ------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:34200/nextchapter
spring.datasource.username=${POSTGRES_USER:nextchapter}
spring.datasource.password=${POSTGRES_PASSWORD:nextchapter}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none

# --- Flyway ---------------------------------------------------------------
# 스키마의 원천. 마이그레이션은 adapter/persistence 의 db/migration 에 있다 —
# 스키마를 소유하는 모듈이 스키마 파일도 갖는다.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Neo4j ----------------------------------------------------------------
spring.neo4j.uri=bolt://localhost:34300
spring.neo4j.authentication.username=${NEO4J_USER:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:nextchapter}

# --- Redis ----------------------------------------------------------------
spring.data.redis.host=localhost
spring.data.redis.port=34600

# --- Kafka ----------------------------------------------------------------
spring.kafka.bootstrap-servers=localhost:34500
# 페이로드는 문자열 JSON 이다. 타입 헤더를 쓰면 헤더에 Java 클래스 이름이 박혀
# 클래스를 옮기는 것만으로 토픽에 쌓인 옛 메시지가 죽는다.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=nextchapter-generation
spring.kafka.consumer.auto-offset-reset=earliest

# 생성 파이프라인 토픽. 이름 규칙은 {집합체}.{단계}.{이벤트} 이고 코드에 박히지 않는다 —
# 개발·스테이징이 한 클러스터를 쓰면 토픽이 섞여 한쪽의 재처리가 다른 쪽 데이터를 만든다.
nextchapter.kafka.prefix=${KAFKA_TOPIC_PREFIX:}
# 본문 토픽의 파티션 수가 곧 본문 생성의 병렬도 상한이다. 키가 챕터 ID 이므로
# 파티션을 늘리면 병렬도가 따라 오른다 (뼈대 ID 를 키로 쓰면 병렬도가 1로 고정된다).
nextchapter.kafka.graph-partitions=3
nextchapter.kafka.outline-partitions=3
nextchapter.kafka.body-partitions=12
nextchapter.kafka.replication-factor=1
# 본문 컨슈머의 스레드 수. 파티션 수를 넘겨도 소용없다 — 남는 스레드는 할당받을 파티션이 없다.
nextchapter.kafka.body-concurrency=4

# --- outbox ---------------------------------------------------------------
# 파티션 키가 뼈대 ID 다 (생성 파이프라인의 본문 토픽과 반대). Neo4j 반영은 값싸고, 대신
# 간선이 노드보다 먼저 도착하면 속성 없는 유령 노드가 생긴다 — 순서가 병렬도보다 중요하다.
nextchapter.kafka.outbox.prefix=${KAFKA_TOPIC_PREFIX:}
nextchapter.kafka.outbox.partitions=3
nextchapter.kafka.outbox.replication-factor=1
nextchapter.kafka.outbox.poll-limit=100
nextchapter.kafka.outbox.poll-interval-ms=1000

# --- 신호 ------------------------------------------------------------------
# 파티션 키가 챕터 ID 다. 집계 축이 "같은 챕터·같은 블록에 몇 건 모였는가"이므로 챕터 단위
# 순서면 충분하고, 챕터가 많아질수록 병렬도가 함께 오른다.
#
# 발행이 커밋 직후가 아니라 스윕인 이유는 유실을 만들지 않기 위해서다 — 커밋 뒤 발행이
# 실패하면 그 신호는 집계에 영원히 도달하지 않고, 그 유실은 "임계치가 트리거되지 않는다"로
# 조용히 나타난다. 개인 루프는 같은 트랜잭션에서 이미 기록됐다.
nextchapter.kafka.signal.prefix=${KAFKA_TOPIC_PREFIX:}
nextchapter.kafka.signal.partitions=6
nextchapter.kafka.signal.replication-factor=1
nextchapter.kafka.signal.poll-limit=200
nextchapter.kafka.signal.poll-interval-ms=1000

# --- 오브젝트 스토리지 ----------------------------------------------------
# M0 에서는 SDK 없이 헬스 경로만 확인한다. 스토리지 수단 결정은 M6.
nextchapter.storage.endpoint=http://localhost:34700
nextchapter.storage.health-path=/minio/health/live

# --- 보안 ------------------------------------------------------------------
# JWT 서명 키. 값이 없으면 부팅마다 임의 키를 쓰고 경고한다 (발급된 토큰이 재기동 시 무효).
# 고정 기본키를 코드·설정에 두지 않는 이유는 그 값이 배포본 전체에서 같아지기 때문이다.
nextchapter.security.jwt.secret=${JWT_SECRET:}
nextchapter.security.jwt.ttl=8h
# 사용자 토큰은 더 길다. 리프레시 토큰을 두지 않기로 했으므로 이 값이 곧 세션 길이이고,
# 학습 중에 8시간마다 다시 로그인하게 만드는 것이 더 나쁘다. 관리자 쪽을 같이 늘리지 않는
# 이유는 그 토큰 뒤에 승인 대기열과 비용 설정이 있기 때문이다.
nextchapter.security.jwt.user-ttl=7d
nextchapter.security.jwt.issuer=nextchapter

# --- 소셜 로그인 ------------------------------------------------------------
# 클라이언트 ID·시크릿에 기본값을 두지 않는다. 값이 없으면 그 제공자만 실패하고
# 나머지는 정상 동작한다 — 지원 제공자 목록(/api/auth/providers)이 설정에서 역산된다.
#
# 엔드포인트까지 설정으로 빼 둔 이유는 테스트가 로컬 스텁 서버를 가리킬 수 있어야 하기
# 때문이다. 주소를 코드에 박으면 이 어댑터에서 정작 틀릴 수 있는 것(헤더 이름·JSON 필드
# 이름)이 테스트에서 빠진다.
nextchapter.auth.social.google.client-id=${GOOGLE_CLIENT_ID:}
nextchapter.auth.social.google.client-secret=${GOOGLE_CLIENT_SECRET:}
nextchapter.auth.social.google.token-uri=https://oauth2.googleapis.com/token
nextchapter.auth.social.google.user-info-uri=https://openidconnect.googleapis.com/v1/userinfo
nextchapter.auth.social.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
nextchapter.auth.social.google.scope=openid email profile
nextchapter.auth.social.kakao.client-id=${KAKAO_CLIENT_ID:}
nextchapter.auth.social.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
nextchapter.auth.social.kakao.token-uri=https://kauth.kakao.com/oauth/token
nextchapter.auth.social.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
nextchapter.auth.social.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
# Kakao 의 이메일은 동의 항목이다. 받지 못해도 로그인은 성립한다.
nextchapter.auth.social.kakao.scope=profile_nickname account_email
nextchapter.auth.social.connect-timeout=5s
nextchapter.auth.social.read-timeout=10s

# --- 최초 관리자 계정 ------------------------------------------------------
# 관리자 계정이 하나도 없을 때만 쓰인다. 값이 없으면 계정을 만들지 않는다.
nextchapter.admin.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:}
nextchapter.admin.bootstrap.name=${ADMIN_BOOTSTRAP_NAME:관리자}
nextchapter.admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}

# --- 캐시 ------------------------------------------------------------------
# 키가 chapter:{id}:v{version}:{format} 이라 무효화 코드가 없다. 뼈대가 수정되면 버전이
# 올라 새 키를 보게 되고, 구버전 키는 TTL 로 사라진다 — TTL 이 유일한 정리 수단이므로
# 없으면 구버전 키가 영구히 쌓인다.
nextchapter.cache.chapter-ttl=24h

# --- 레이트 리밋 -----------------------------------------------------------
# 주제 해소만 따로 막는다. 호출 하나가 LLM 을 최대 3번 부르므로, 이 경로를 열어 두면
# 비용 남용이 그대로 예산 상한으로 흘러 다른 사용자의 생성까지 멈춘다.
# 카운터는 Redis 다 — 프로세스 메모리에 두면 한도가 인스턴스 수만큼 곱해진다.
nextchapter.rate-limit.topic-resolve-per-window=10
nextchapter.rate-limit.topic-resolve-window=10m

# --- Actuator -------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

# --- AI 프로바이더 --------------------------------------------------------
# 모델은 여기 없다. 단계별 벤더·모델은 DB(ai_stage_settings)와 관리 화면이 정한다.
# 여기 있는 것은 "어디로 붙는가"뿐이며, 프록시·게이트웨이를 끼울 때만 바뀐다.
nextchapter.ai.anthropic-base-url=${ANTHROPIC_BASE_URL:https://api.anthropic.com}
nextchapter.ai.anthropic-version=2023-06-01
nextchapter.ai.voyage-base-url=${VOYAGE_BASE_URL:https://api.voyageai.com}
nextchapter.ai.connect-timeout=10s
# 본문 생성이 실제로 분 단위다. 짧게 잡으면 거의 끝난 호출을 버리고 재시도해 비용만 두 배가 된다.
nextchapter.ai.read-timeout=5m

# 저장 암호화 마스터 키. AI 프로바이더 API 키를 암호문으로 저장하는 데 쓴다.
# 이 값만은 환경변수로 온다 — 암호문과 키가 같은 DB 에 있으면 암호화가 의미를 잃는다.
nextchapter.security.secret-key=${SECRET_KEY:}
