spring.application.name=nextchapter
server.port=34000

# --- PostgreSQL (pgvector) ------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:34200/nextchapter
spring.datasource.username=${POSTGRES_USER:nextchapter}
spring.datasource.password=${POSTGRES_PASSWORD:nextchapter}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none

# --- Neo4j ----------------------------------------------------------------
spring.neo4j.uri=bolt://localhost:34300
spring.neo4j.authentication.username=${NEO4J_USER:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:nextchapter}

# --- Redis ----------------------------------------------------------------
spring.data.redis.host=localhost
spring.data.redis.port=34600

# --- Kafka ----------------------------------------------------------------
spring.kafka.bootstrap-servers=localhost:34500

# --- 오브젝트 스토리지 ----------------------------------------------------
# M0 에서는 SDK 없이 헬스 경로만 확인한다. 스토리지 수단 결정은 M6.
nextchapter.storage.endpoint=http://localhost:34700
nextchapter.storage.health-path=/minio/health/live

# --- Actuator -------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
