spring.application.name=nextchapter
server.port=34000

# --- PostgreSQL (pgvector) ------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:34200/nextchapter
spring.datasource.username=${POSTGRES_USER:nextchapter}
spring.datasource.password=${POSTGRES_PASSWORD:nextchapter}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none

# --- Flyway ---------------------------------------------------------------
# 스키마의 원천. 마이그레이션은 adapter/persistence 의 db/migration 에 있다 —
# 스키마를 소유하는 모듈이 스키마 파일도 갖는다.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Neo4j ----------------------------------------------------------------
spring.neo4j.uri=bolt://localhost:34300
spring.neo4j.authentication.username=${NEO4J_USER:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:nextchapter}

# --- Redis ----------------------------------------------------------------
spring.data.redis.host=localhost
spring.data.redis.port=34600

# --- Kafka ----------------------------------------------------------------
spring.kafka.bootstrap-servers=localhost:34500
# 페이로드는 문자열 JSON 이다. 타입 헤더를 쓰면 헤더에 Java 클래스 이름이 박혀
# 클래스를 옮기는 것만으로 토픽에 쌓인 옛 메시지가 죽는다.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=nextchapter-generation
spring.kafka.consumer.auto-offset-reset=earliest

# 생성 파이프라인 토픽. 이름 규칙은 {집합체}.{단계}.{이벤트} 이고 코드에 박히지 않는다 —
# 개발·스테이징이 한 클러스터를 쓰면 토픽이 섞여 한쪽의 재처리가 다른 쪽 데이터를 만든다.
nextchapter.kafka.prefix=${KAFKA_TOPIC_PREFIX:}
# 본문 토픽의 파티션 수가 곧 본문 생성의 병렬도 상한이다. 키가 챕터 ID 이므로
# 파티션을 늘리면 병렬도가 따라 오른다 (뼈대 ID 를 키로 쓰면 병렬도가 1로 고정된다).
nextchapter.kafka.graph-partitions=3
nextchapter.kafka.outline-partitions=3
nextchapter.kafka.body-partitions=12
nextchapter.kafka.replication-factor=1
# 본문 컨슈머의 스레드 수. 파티션 수를 넘겨도 소용없다 — 남는 스레드는 할당받을 파티션이 없다.
nextchapter.kafka.body-concurrency=4

# --- 오브젝트 스토리지 ----------------------------------------------------
# M0 에서는 SDK 없이 헬스 경로만 확인한다. 스토리지 수단 결정은 M6.
nextchapter.storage.endpoint=http://localhost:34700
nextchapter.storage.health-path=/minio/health/live

# --- 보안 ------------------------------------------------------------------
# JWT 서명 키. 값이 없으면 부팅마다 임의 키를 쓰고 경고한다 (발급된 토큰이 재기동 시 무효).
# 고정 기본키를 코드·설정에 두지 않는 이유는 그 값이 배포본 전체에서 같아지기 때문이다.
nextchapter.security.jwt.secret=${JWT_SECRET:}
nextchapter.security.jwt.ttl=8h
nextchapter.security.jwt.issuer=nextchapter

# --- 최초 관리자 계정 ------------------------------------------------------
# 관리자 계정이 하나도 없을 때만 쓰인다. 값이 없으면 계정을 만들지 않는다.
nextchapter.admin.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:}
nextchapter.admin.bootstrap.name=${ADMIN_BOOTSTRAP_NAME:관리자}
nextchapter.admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}

# --- Actuator -------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

# --- AI 프로바이더 --------------------------------------------------------
# 모델은 여기 없다. 단계별 벤더·모델은 DB(ai_stage_settings)와 관리 화면이 정한다.
# 여기 있는 것은 "어디로 붙는가"뿐이며, 프록시·게이트웨이를 끼울 때만 바뀐다.
nextchapter.ai.anthropic-base-url=${ANTHROPIC_BASE_URL:https://api.anthropic.com}
nextchapter.ai.anthropic-version=2023-06-01
nextchapter.ai.voyage-base-url=${VOYAGE_BASE_URL:https://api.voyageai.com}
nextchapter.ai.connect-timeout=10s
# 본문 생성이 실제로 분 단위다. 짧게 잡으면 거의 끝난 호출을 버리고 재시도해 비용만 두 배가 된다.
nextchapter.ai.read-timeout=5m

# 저장 암호화 마스터 키. AI 프로바이더 API 키를 암호문으로 저장하는 데 쓴다.
# 이 값만은 환경변수로 온다 — 암호문과 키가 같은 DB 에 있으면 암호화가 의미를 잃는다.
nextchapter.security.secret-key=${SECRET_KEY:}
