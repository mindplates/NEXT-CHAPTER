spring.application.name=nextchapter
server.port=34000

# --- PostgreSQL (pgvector) ------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:34200/nextchapter
spring.datasource.username=${POSTGRES_USER:nextchapter}
spring.datasource.password=${POSTGRES_PASSWORD:nextchapter}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none

# --- Flyway ---------------------------------------------------------------
# 스키마의 원천. 마이그레이션은 adapter/persistence 의 db/migration 에 있다 —
# 스키마를 소유하는 모듈이 스키마 파일도 갖는다.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Neo4j ----------------------------------------------------------------
spring.neo4j.uri=bolt://localhost:34300
spring.neo4j.authentication.username=${NEO4J_USER:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:nextchapter}

# --- Redis ----------------------------------------------------------------
spring.data.redis.host=localhost
spring.data.redis.port=34600

# --- Kafka ----------------------------------------------------------------
spring.kafka.bootstrap-servers=localhost:34500

# --- 오브젝트 스토리지 ----------------------------------------------------
# M0 에서는 SDK 없이 헬스 경로만 확인한다. 스토리지 수단 결정은 M6.
nextchapter.storage.endpoint=http://localhost:34700
nextchapter.storage.health-path=/minio/health/live

# --- 보안 ------------------------------------------------------------------
# JWT 서명 키. 값이 없으면 부팅마다 임의 키를 쓰고 경고한다 (발급된 토큰이 재기동 시 무효).
# 고정 기본키를 코드·설정에 두지 않는 이유는 그 값이 배포본 전체에서 같아지기 때문이다.
nextchapter.security.jwt.secret=${JWT_SECRET:}
nextchapter.security.jwt.ttl=8h
nextchapter.security.jwt.issuer=nextchapter

# --- 최초 관리자 계정 ------------------------------------------------------
# 관리자 계정이 하나도 없을 때만 쓰인다. 값이 없으면 계정을 만들지 않는다.
nextchapter.admin.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:}
nextchapter.admin.bootstrap.name=${ADMIN_BOOTSTRAP_NAME:관리자}
nextchapter.admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}

# --- Actuator -------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
