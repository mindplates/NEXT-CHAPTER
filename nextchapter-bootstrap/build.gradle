// 조립만 하는 모듈. 여기에 도메인 로직을 두지 않는다.
plugins {
    id 'org.springframework.boot'
}

bootRun {
    workingDir = rootProject.projectDir
}

dependencies {
    implementation project(':nextchapter-common')
    implementation project(':nextchapter-domain')
    implementation project(':nextchapter-application')
    implementation project(':nextchapter-adapter:web')
    implementation project(':nextchapter-adapter:messaging')
    implementation project(':nextchapter-adapter:persistence')
    implementation project(':nextchapter-adapter:graph')
    implementation project(':nextchapter-adapter:cache')
    implementation project(':nextchapter-adapter:storage')
    implementation project(':nextchapter-adapter:ai')
    implementation project(':nextchapter-adapter:media')
    implementation project(':nextchapter-adapter:security')

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // 초기 카탈로그 시드 파일을 읽는다. 조립 모듈이 JSON 을 직접 다루는 유일한 지점이고,
    // 그 이유는 "언제 투입하는가"가 기동 절차의 관심사이기 때문이다.
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
