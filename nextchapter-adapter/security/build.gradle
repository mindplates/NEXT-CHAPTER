// 인증 경로 두 개를 모두 담당한다.
//   일반 사용자 — OAuth2 소셜 로그인 → JWT
//   관리자      — 자체 계정 → JWT, 역할 ADMIN
// 관리자를 분리하는 이유는 편의가 아니라 가용성이다. 소셜 제공자가 죽었을 때
// 승인 대기열과 비용 설정에 접근할 수 없는 상태는 받아들일 수 없다.
dependencies {
    implementation project(':nextchapter-common')
    implementation project(':nextchapter-domain')
    implementation project(':nextchapter-application')
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    // JWT 발급·검증을 직접 구현하지 않는다. resource-server 의 NimbusJwtEncoder/Decoder 와
    // oauth2ResourceServer DSL 을 쓰면 서명·만료·클레임 검증이 프레임워크 쪽에 남는다 —
    // 직접 만든 필터는 "만료를 확인하는 줄을 빠뜨려도 통과하는" 실패 방식을 갖는다.
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-security-test'
    // 필터 체인은 서블릿 컨텍스트가 있어야 검증된다. "관리 경로가 실제로 잠겨 있는지"는
    // 빈 배선을 눈으로 읽어 확인할 수 있는 종류의 사실이 아니다.
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    // 서블릿 API 와 MVC 는 이 모듈의 런타임 의존이 아니다 (조립은 bootstrap 이 한다).
    // 테스트에서만 필요하다 — 필터 체인을 검증하려면 서블릿 컨텍스트가 있어야 한다.
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc'
}
