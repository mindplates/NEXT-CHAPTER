// out 어댑터 — Neo4j. 챕터 ID·관계·챕터 임베딩만 갖는 얇은 그래프.
// 본문은 여기 없다(Postgres 가 원천). 파생 저장소이므로 통째 재구축이 가능해야 한다.
dependencies {
    implementation project(':nextchapter-common')
    implementation project(':nextchapter-domain')
    implementation project(':nextchapter-application')
    implementation 'org.springframework.boot:spring-boot-starter-data-neo4j'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // 파생 그래프의 위험은 Cypher 문법이 아니라 멱등성이다 — 같은 이벤트를 두 번 적용했을 때,
    // 옛 버전 이벤트가 다시 왔을 때 무엇이 남는지는 실제 Neo4j 에 붙여야만 확인된다.
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-neo4j'
}
