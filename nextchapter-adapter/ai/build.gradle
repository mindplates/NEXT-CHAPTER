// out 어댑터 — LLM 프로바이더. 독립 모듈인 이유는 벤더 교체 가능성 때문이다.
// 모델을 코드에 박지 않고 단계별로 관리 화면에서 지정한다. API 키도 콘솔에서 관리한다
// (코드·환경변수 하드코딩 금지). 테스트는 LLM 응답 스터브.
dependencies {
    implementation project(':nextchapter-common')
    implementation project(':nextchapter-domain')
    implementation project(':nextchapter-application')
    implementation 'org.springframework:spring-web'
    implementation 'org.springframework:spring-context'
    // @ConfigurationProperties 만 쓴다. 웹 자동설정에 의존하지 않으려고 starter 를 넣지 않았다 —
    // 이 어댑터는 배치·컨슈머처럼 웹 없이 뜨는 조립에서도 쓰인다.
    implementation 'org.springframework.boot:spring-boot'
    implementation 'org.springframework.boot:spring-boot-starter-logging'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
